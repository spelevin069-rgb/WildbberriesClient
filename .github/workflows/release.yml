
name: Build and publish installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build launcher EXE
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name WildbberriesClient --icon assets\wildbberries.ico --collect-all qfluentwidgets --collect-all PyQt6 src\main.py

      - name: Prepare client bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bundle | Out-Null
          Copy-Item dist/WildbberriesClient.exe bundle/
          Copy-Item ClientPayload.zip bundle/
          Copy-Item assets bundle/assets -Recurse
          Copy-Item launcher-settings.json bundle/
          Compress-Archive -Path bundle/* -DestinationPath WildbberriesClient-Bundle.zip -Force

      - name: Publish installer and bundle
        shell: pwsh
        run: |
          dotnet publish bootstrapper/Installer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o installer-out
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'manual-' + $env:GITHUB_RUN_NUMBER }
          gh release create $tag installer-out/WildbberriesInstaller.exe WildbberriesClient-Bundle.zip --title "WildbberriesClient $tag" --notes "Windows installer. Download WildbberriesInstaller.exe and run it."
        env:
          GH_TOKEN: ${{ github.token }}
